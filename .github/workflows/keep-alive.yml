# Évite la mise en pause du projet Supabase gratuit (pause après ~7 jours sans activité).
# Deux fois par semaine, GitHub fait une simple lecture publique de la base.
# Utilise uniquement la clé publique (déjà visible dans js/config.js).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4' # lundi et jeudi, 6 h 17 UTC
  workflow_dispatch: {}     # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture d'une destination
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js)
          curl --fail --silent --show-error "$URL/rest/v1/destinations?select=id&limit=1" -H "apikey: $KEY"
